<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北講堂影音架構拓撲圖</title>
<style>
:root {
  --bg-page: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  --bg-panel: #ffffff;
  --text-main: #0f172a;
  --text-sub: #475569;
  --border-btn: #cbd5e1;
  --bg-btn-hover: #f1f5f9;
  
  /* 旗艦高對比清新色調 */
  --c-audio: #10b981; /* 翡翠綠 */
  --c-video: #e11d48; /* 玫瑰紅 */
  --c-net:   #3b82f6; /* 亮麗藍 */
  --c-proj:  #f59e0b; /* 琥珀橘 */
}

body { margin: 0; padding: 30px; background: var(--bg-page); font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; }
.wrap { max-width: 2300px; width: 100%; display: flex; flex-direction: column; align-items: center; }

/* 頂部過濾按鈕區 */
.bar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; background: var(--bg-panel); padding: 18px 36px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 12px; border: 1px solid var(--border-btn); background: transparent; color: var(--text-sub); font-size: 16px; font-weight: 700; cursor: pointer; user-select: none; transition: all .2s; }
.btn:hover { background: var(--bg-btn-hover); color: var(--text-main); border-color: #94a3b8; }
.btn[aria-pressed="true"] { background: var(--text-main); color: #ffffff; border-color: var(--text-main); box-shadow: 0 4px 12px rgba(15,23,42,0.2); }
.sw { width: 14px; height: 14px; border-radius: 50%; flex: none; }

/* SVG 主畫布 */
#topo { background: #ffffff; border-radius: 24px; box-shadow: 0 15px 50px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; max-width: 100%; height: auto; }

/* 互動漸隱效果 */
#topo .e, #topo .n, #topo .lbl { transition: opacity 0.35s ease; }
#topo[data-filter] .e, #topo[data-filter] .n, #topo[data-filter] .lbl { opacity: 0.06; }
#topo[data-filter="audio"] .d-audio, #topo[data-filter="video"] .d-video, 
#topo[data-filter="net"] .d-net, #topo[data-filter="proj"] .d-proj { opacity: 1; }

/* 節點樣式 */
.n rect { fill: #ffffff; stroke-width: 3; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.05)); }
.n:hover rect { transform: translateY(-4px); filter: drop-shadow(0 12px 20px rgba(0,0,0,0.12)); stroke-width: 4.5; }

.n.d-audio rect { stroke: var(--c-audio); }
.n.d-video rect { stroke: var(--c-video); }
.n.d-net rect { stroke: var(--c-net); }
.n.d-proj rect { stroke: var(--c-proj); }
/* 當節點擁有多重屬性時，預設顯示顏色 (可依需求調整優先級) */
.n.d-video.d-audio rect { stroke: var(--c-video); }
.n.d-net.d-video rect { stroke: var(--c-net); }

/* 文字與圖標 */
.ic { color: #334155; }
.th { fill: var(--text-main); font-weight: 800; dominant-baseline: central; font-size: 17px; }
.ts { fill: var(--text-sub); font-size: 13px; font-weight: 600; dominant-baseline: central; }

/* 線條樣式 (加大加粗) */
.e { fill: none; stroke-width: 3.5; stroke-linecap: butt; stroke-linejoin: round; }
@media (prefers-reduced-motion: no-preference) { .e { animation: flow 1.5s linear infinite; } }
@keyframes flow { to { stroke-dashoffset: -40; } }

.e.d-audio { stroke: var(--c-audio); stroke-dasharray: 10 10; }
.e.d-video { stroke: var(--c-video); stroke-dasharray: 10 10; }
.e.d-net   { stroke: var(--c-net);   stroke-dasharray: 8 8; }
.e.d-proj  { stroke: var(--c-proj);  stroke-dasharray: 14 10; }

/* 圓形文字標籤 */
.lbl circle { stroke-width: 2.5; fill: #ffffff; }
.lbl text { font-family: monospace; font-size: 15px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
.lbl.d-audio circle { stroke: var(--c-audio); }
.lbl.d-audio text { fill: var(--c-audio); }
</style>
</head>
<body>

<div class="wrap">
  <div class="bar" role="group" aria-label="signal filter">
    <button class="btn" data-f="" aria-pressed="true">全部訊號顯示</button>
    <button class="btn" data-f="audio" aria-pressed="false"><span class="sw" style="background:var(--c-audio)"></span>音訊 (Audio)</button>
    <button class="btn" data-f="video" aria-pressed="false"><span class="sw" style="background:var(--c-video)"></span>影像 (Video/HDMI)</button>
    <button class="btn" data-f="net" aria-pressed="false"><span class="sw" style="background:var(--c-net)"></span>網路 (Network)</button>
    <button class="btn" data-f="proj" aria-pressed="false"><span class="sw" style="background:var(--c-proj)"></span>投影 (Projection)</button>
  </div>

  <svg id="topo" viewBox="0 0 2100 1400" role="img">
    <title>台北講堂影音架構拓撲圖</title>
    
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#94a3b8" opacity="0.35"/></pattern>
      
      <marker id="arw-aud" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="var(--c-audio)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="arw-vid" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="var(--c-video)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="arw-net" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="var(--c-net)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="arw-proj" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="var(--c-proj)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>

      <symbol id="ic-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 19c0-4 3-6 6.5-6s6.5 2 6.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="ic-laptop" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 19h20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
      <symbol id="ic-meet" viewBox="0 0 24 24"><path d="M7 16.5h8.5a3.2 3.2 0 0 0 .4-6.4 4.3 4.3 0 0 0-8.2-1.3A3.3 3.3 0 0 0 7 16.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10.8 10.5l3 1.9-3 1.9z" fill="currentColor"/></symbol>
      <symbol id="ic-cam" viewBox="0 0 24 24"><rect x="2" y="8" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 11l6-2.5v8l-6-2.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="ic-mixer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7v10M12 7v10M16 7v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="13" r="2" fill="currentColor"/><circle cx="12" cy="10" r="2" fill="currentColor"/><circle cx="16" cy="14.5" r="2" fill="currentColor"/></symbol>
      <symbol id="ic-speaker" viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 9.5a4 4 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="ic-proj" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="11" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M17 8.5l4.5 3-4.5 3z" fill="currentColor" opacity="0.8"/></symbol>
      <symbol id="ic-capture" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="11" width="10" height="2.5" rx="1" fill="currentColor"/></symbol>
      <symbol id="ic-switcher" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="8" width="7" height="4" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="10" r="1.5" fill="currentColor"/><circle cx="18" cy="10" r="1.5" fill="currentColor"/><path d="M5 16h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="ic-matrix" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 11h20" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="14" width="2.5" height="2.5" fill="currentColor"/><rect x="9" y="14" width="2.5" height="2.5" fill="currentColor"/><rect x="13" y="14" width="2.5" height="2.5" fill="currentColor"/><rect x="17" y="14" width="2.5" height="2.5" fill="currentColor"/></symbol>
    </defs>

    <rect width="100%" height="100%" fill="url(#grid)" rx="24"/>

    <text x="1050" y="55" text-anchor="middle" fill="var(--text-main)" style="font-size:32px; font-weight:900; letter-spacing:3px">台北講堂 · 115 年度義工講習直播</text>
    <text x="1050" y="90" text-anchor="middle" fill="var(--c-net)" style="font-size:18px; font-weight:700; letter-spacing:5px">影音拓撲圖</text>

    <g id="edges">
      
      <path class="e d-audio" d="M 1710 120 L 1710 90 L 280 90 L 280 480 L 560 480 L 560 450" marker-end="url(#arw-aud)"/>
      
      <path class="e d-audio" d="M 390 190 L 390 280 C 390 330, 550 330, 550 360 L 550 380" marker-end="url(#arw-aud)"/>

      <path class="e d-video" d="M 1270 190 L 1270 280 C 1270 330, 1100 330, 1100 360 L 1100 380" marker-end="url(#arw-vid)"/>
      <path class="e d-video" d="M 1020 450 L 1020 900" marker-end="url(#arw-vid)"/>
      
      <path class="e d-video" d="M 1710 190 L 1710 240 L 1820 240 L 1820 1020 L 1100 1020 L 1100 970" marker-end="url(#arw-vid)"/>

      <path class="e d-video" d="M 1270 900 L 1270 710" marker-end="url(#arw-vid)"/>

      <path class="e d-net" d="M 1490 190 L 1490 415 L 1140 415" marker-end="url(#arw-net)"/>

      <path class="e d-net" d="M 520 660 L 260 660" marker-end="url(#arw-net)"/>

      <path class="e d-net" d="M 1620 690 L 1360 690" marker-end="url(#arw-net)"/>

      <path class="e d-proj" d="M 1050 970 L 1050 1160" marker-end="url(#arw-proj)"/>
      <path class="e d-proj" d="M 980 970 L 980 1060 L 40 1060 L 40 155 L 80 155" marker-end="url(#arw-proj)"/>
      <path class="e d-proj" d="M 1120 970 L 1120 1060 L 2060 1060 L 2060 155 L 2020 155" marker-end="url(#arw-proj)"/>
      
    </g>

    <g id="labels">
      <g class="lbl d-audio"><circle cx="470" cy="330" r="14"/><text x="470" y="330">A</text></g>
      <g class="lbl d-audio"><circle cx="610" cy="285" r="14"/><text x="610" y="285">B</text></g>
      <g class="lbl d-audio"><circle cx="830" cy="400" r="14"/><text x="830" y="400">C</text></g>
      <g class="lbl d-audio"><circle cx="420" cy="480" r="14"/><text x="420" y="480">D</text></g>
      <g class="lbl d-audio"><circle cx="830" cy="430" r="14"/><text x="830" y="430">E</text></g>
      <g class="lbl d-audio"><circle cx="610" cy="545" r="14"/><text x="610" y="545">F</text></g>
    </g>

    <g id="nodes">
      
      <g class="n d-proj"><rect x="80" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-proj" x="155" y="128" width="24" height="24"/><text class="th" x="170" y="165" text-anchor="middle">影像會議室投影</text></g>
      <g class="n d-audio"><rect x="300" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-person" x="375" y="128" width="24" height="24"/><text class="th" x="390" y="165" text-anchor="middle">老師·首長·司儀</text></g>
      <g class="n d-audio"><rect x="520" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-person" x="595" y="128" width="24" height="24"/><text class="th" x="610" y="165" text-anchor="middle">發言者</text></g>
      <g class="n d-video"><rect x="740" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-cam" x="815" y="128" width="24" height="24"/><text class="th" x="830" y="165" text-anchor="middle">攝影機 N</text></g>
      <g class="n d-video"><rect x="1180" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-cam" x="1255" y="128" width="24" height="24"/><text class="th" x="1270" y="165" text-anchor="middle">前攝影</text></g>

      <g class="n d-video d-audio"><rect x="1620" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-laptop" x="1695" y="128" width="24" height="24"/><text class="th" x="1710" y="165" text-anchor="middle">老師筆電</text></g>
      <g class="n d-proj"><rect x="1840" y="120" width="180" height="70" rx="12"/><use class="ic" href="#ic-proj" x="1915" y="128" width="24" height="24"/><text class="th" x="1930" y="165" text-anchor="middle">字幕會議室投影</text></g>

      <g class="n d-audio"><rect x="300" y="380" width="180" height="70" rx="12"/><use class="ic" href="#ic-speaker" x="375" y="388" width="24" height="24"/><text class="th" x="390" y="425" text-anchor="middle">播音系統</text></g>
      <g class="n d-audio"><rect x="520" y="380" width="180" height="70" rx="12"/><use class="ic" href="#ic-mixer" x="595" y="388" width="24" height="24"/><text class="th" x="610" y="418" text-anchor="middle">混音器</text><text class="ts" x="610" y="438" text-anchor="middle">Mixer</text></g>
      <g class="n d-video d-audio d-net"><rect x="960" y="380" width="180" height="70" rx="12"/><use class="ic" href="#ic-switcher" x="1035" y="388" width="24" height="24"/><text class="th" x="1050" y="418" text-anchor="middle">導播機</text><text class="ts" x="1050" y="438" text-anchor="middle">Switcher</text></g>

      <g class="n d-net"><rect x="80" y="640" width="180" height="70" rx="12"/><use class="ic" href="#ic-meet" x="155" y="648" width="24" height="24"/><text class="th" x="170" y="678" text-anchor="middle">影像會議室</text><text class="ts" x="170" y="698" text-anchor="middle">Google Meet</text></g>
      <g class="n d-net d-video d-audio"><rect x="520" y="640" width="180" height="70" rx="12"/><use class="ic" href="#ic-laptop" x="595" y="648" width="24" height="24"/><text class="th" x="610" y="685" text-anchor="middle">影像會議室電腦</text></g>

      <g class="n d-net"><rect x="1620" y="640" width="180" height="70" rx="12"/><use class="ic" href="#ic-meet" x="1695" y="648" width="24" height="24"/><text class="th" x="1710" y="678" text-anchor="middle">字幕會議室</text><text class="ts" x="1710" y="698" text-anchor="middle">Google Meet</text></g>

      <g class="n d-video"><rect x="520" y="900" width="180" height="70" rx="12"/><use class="ic" href="#ic-capture" x="595" y="908" width="24" height="24"/><text class="th" x="610" y="938" text-anchor="middle">截取卡</text><text class="ts" x="610" y="958" text-anchor="middle">影像</text></g>
      <g class="n d-video d-proj"><rect x="960" y="900" width="180" height="70" rx="12"/><use class="ic" href="#ic-matrix" x="1035" y="908" width="24" height="24"/><text class="th" x="1050" y="938" text-anchor="middle">HDMI 矩陣</text><text class="ts" x="1050" y="958" text-anchor="middle">Matrix</text></g>
      <g class="n d-video"><rect x="1180" y="900" width="180" height="70" rx="12"/><use class="ic" href="#ic-capture" x="1255" y="908" width="24" height="24"/><text class="th" x="1270" y="938" text-anchor="middle">截取卡</text><text class="ts" x="1270" y="958" text-anchor="middle">字幕</text></g>

      <g class="n d-proj"><rect x="960" y="1160" width="180" height="70" rx="12"/><use class="ic" href="#ic-proj" x="1035" y="1168" width="24" height="24"/><text class="th" x="1050" y="1198" text-anchor="middle">後投影</text><text class="ts" x="1050" y="1218" text-anchor="middle">給老師·首長</text></g>
      
    </g>
  </svg>
</div>

<script>
(function(){
  var svg = document.getElementById('topo');
  var btns = [].slice.call(document.querySelectorAll('.btn'));
  function setF(f){
    if(!f || svg.getAttribute('data-filter') === f){
      svg.removeAttribute('data-filter');
      f = null;
    } else {
      svg.setAttribute('data-filter', f);
    }
    btns.forEach(function(b){
      b.setAttribute('aria-pressed', (b.dataset.f && b.dataset.f === f || (!f && !b.dataset.f)) ? 'true' : 'false');
    });
  }
  btns.forEach(function(b){
    b.addEventListener('click', function(){ setF(b.dataset.f || null); });
  });
})();
</script>

</body>
</html>
